<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal - My Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
      line-height: 1.6;
    }

    header {
      background-color: #111;
      color: white;
      padding: 20px 0;
      text-align: center;
      position: relative;
    }

    .language-selector {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
    }

    .language-selector a {
      display: block;
    }

    .language-selector img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      transition: transform 0.2s;
      cursor: pointer;
    }

    .language-selector img:hover {
      transform: scale(1.1);
    }

    nav {
      background-color: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      padding: 10px 0;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 16px;
      padding: 8px 16px;
      transition: all 0.3s;
      border-radius: 8px;
    }

    nav a:hover {
      background-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 40px;
      background-color: #faf9f6;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      text-align: center;
      color: white;
    }

    h2 {
      color: #333;
    }

    p {
      margin-bottom: 20px;
      font-size: 1.1rem;
      color: #333;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      margin-top: 40px;
      color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>

  <header>
    <div class="language-selector">
      <a href="perso.html" title="Français">
        <img src="images/france.png" alt="Français">
      </a>
      <a href="perso-en.html" title="English">
        <img src="images/royaume-uni.png" alt="English">
      </a>
      <a href="coming-soon.html" title="Deutsch">
        <img src="images/allemagne.png" alt="Deutsch">
      </a>
    </div>
    <h1>My Personal Space</h1>
  </header>

  <nav>
    <a href="index-en.html">Home</a>
    <a href="realisations-en.html">Achievements</a>
    <a href="projets-en.html">Projects</a>
    <a href="perso-en.html">Personal</a>
    <a href="contact-en.html">Contact</a>
  </nav>

  <main>
    <h2>A bit about me</h2>
    <p><br><br>Nothing here yet... <br>I'm focusing first on setting up the projects section before filling this part.</p>
<br><br><br><br><br><br><br><br><br><br>
    <p></p>

    <p></p>
  </main>

  <footer>
    © 2025 My Website. All rights reserved… but honestly, do what you want, I'm not litigious.
  </footer>

</body>
</html>
